<app-navbar
  [currentView]="currentView()"
  (homeClick)="showHome()"
  (aboutClick)="showAbout()"
  (recipesClick)="showRecipes()"
/>

@if (currentView() === 'home') {
  <div class="page-view">
    <app-hero (browseClick)="showRecipes()" />
    <app-features />
    <hr class="section-divider">
    <app-real-life />
    <app-cta (browseClick)="showRecipes()" />
    <app-footer />
  </div>
}

@if (currentView() === 'about') {
  <div class="page-view">
    <app-about />
    <app-cta (browseClick)="showRecipes()" />
    <app-footer />
  </div>
}

@if (currentView() === 'recipes') {
  <div class="page-view">
    <app-recipes
      [filteredRecipes]="filteredRecipes()"
      [filteredCount]="filteredCount()"
      [searchQuery]="searchQuery()"
      [maxPrepTime]="maxPrepTime()"
      [maxCookTime]="maxCookTime()"
      (queryChange)="searchQuery.set($event)"
      (maxPrepTimeChange)="maxPrepTime.set($event)"
      (maxCookTimeChange)="maxCookTime.set($event)"
    />
    <app-footer />
  </div>
}
