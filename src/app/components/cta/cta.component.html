<section class="cta">
  <div class="cta-container">
    <div class="cta-card">
      <img src="assets/images/pattern-fork.svg" alt="" class="pattern pattern-fork">
      <img src="assets/images/pattern-squiggle-1.svg" alt="" class="pattern pattern-squiggle-left">
      <div class="cta-content">
        <h2>Ready to cook smarter?</h2>
        <p>Hit the button, pick a recipe, and get dinner on the table—fast.</p>
        <button class="btn-primary" (click)="browseClick.emit()">Browse recipes</button>
      </div>
      <img src="assets/images/pattern-knife.svg" alt="" class="pattern pattern-knife">
      <img src="assets/images/pattern-squiggle-2.svg" alt="" class="pattern pattern-squiggle-right">
    </div>
  </div>
</section>
