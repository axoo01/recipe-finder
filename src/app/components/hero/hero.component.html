<section class="hero">
  <img src="assets/images/pattern-squiggle-1.svg" alt="" aria-hidden="true" class="hero-squiggle">

  <div class="hero-inner">
    <div class="hero-content">
      <h1>
        <span class="word-bg-wrapper">
          <img src="assets/images/orange-hero-diiv.png" alt="" aria-hidden="true" class="word-bg-img">
          <span class="word-text">Healthy</span>
        </span>
         meals, <span class="highlight">zero fuss</span>
      </h1>
      <p>Discover eight quick, whole-food recipes that you can cook tonight—no processed junk, no guesswork.</p>
      <button class="btn-primary" (click)="scrollToRecipes()">Start exploring</button>
    </div>

    <div class="hero-image">
      <picture>
        <source media="(min-width: 768px)" srcset="assets/images/image-home-hero-large.webp">
        <img src="assets/images/image-home-hero-small.webp" alt="Person preparing healthy food in a bright kitchen">
      </picture>
    </div>
  </div>
</section>
